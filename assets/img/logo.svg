<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="DY Board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b414d"/>
      <stop offset="0.55" stop-color="#23262e"/>
      <stop offset="1" stop-color="#15171f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="140" rx="58" fill="url(#sheen)"/>
  <text x="128" y="132" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, 'Segoe UI', system-ui, Arial, sans-serif"
        font-size="116" font-weight="800" letter-spacing="-6"
        fill="#f5f7fa" filter="url(#emboss)">Yi+</text>
</svg>
