name: Desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: pnpm desktop:win
          - os: macos-latest
            command: pnpm desktop:mac
          - os: ubuntu-latest
            command: pnpm desktop:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish signed release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: packages-*
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksum manifest with GitHub OIDC
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
            SHA256SUMS
            SHA256SUMS.sigstore.json
