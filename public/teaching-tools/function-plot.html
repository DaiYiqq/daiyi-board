<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html,body{margin:0;height:100%;background:#10131a;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var P = { expr: 'sin(x)*x/5' };

  function send(type, data){ window.parent.postMessage(Object.assign({ type: type }, data || {}), '*'); }

  window.addEventListener('message', function(e){
    var d = e.data || {};
    if (d.type === 'whiteboard:init') {
      Object.assign(P, d.params || {});
      send('tool:ready', { version: '1.0.0' });
    } else if (d.type === 'whiteboard:set-params') {
      Object.assign(P, d.params || {});
    } else if (d.type === 'whiteboard:request-snapshot') {
      send('tool:snapshot', { dataUrl: cv.toDataURL('image/png') });
    }
  });

  function resize(){
    var r = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
  }
  window.addEventListener('resize', resize);
  resize();

  function loop(){
    resize();
    var w = cv.width, h = cv.height;
    ctx.clearRect(0,0,w,h);
    var cx = w/2, cy = h/2, scale = Math.min(w,h)/14;
    // 坐标轴
    ctx.strokeStyle = '#4a5463'; ctx.lineWidth = Math.max(1,w/600);
    ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(w,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,h); ctx.stroke();
    var fn;
    try { fn = new Function('x', 'return (' + P.expr + ');'); }
    catch(e){ ctx.fillStyle='#e06a6a'; ctx.fillText('表达式错误', 10, 20); requestAnimationFrame(loop); return; }
    ctx.strokeStyle = '#7aa7d9'; ctx.lineWidth = Math.max(1.5, w/400);
    ctx.beginPath();
    var first = true;
    for (var px = 0; px <= w; px++){
      var x = (px - cx) / scale;
      var y;
      try { y = fn(x); } catch(e){ y = NaN; }
      if (!isFinite(y)) { first = true; continue; }
      var py = cy - y * scale;
      if (first){ ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
