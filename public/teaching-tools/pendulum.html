<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html,body{margin:0;height:100%;background:#10131a;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var P = { length: 100, gravity: 9.8 };
  var t0 = performance.now();

  function send(type, data){ window.parent.postMessage(Object.assign({ type: type }, data || {}), '*'); }

  window.addEventListener('message', function(e){
    var d = e.data || {};
    if (d.type === 'whiteboard:init') {
      Object.assign(P, d.params || {});
      send('tool:ready', { version: '1.0.0' });
    } else if (d.type === 'whiteboard:set-params') {
      Object.assign(P, d.params || {});
    } else if (d.type === 'whiteboard:request-snapshot') {
      send('tool:snapshot', { dataUrl: cv.toDataURL('image/png') });
    }
  });

  function resize(){
    var r = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
  }
  window.addEventListener('resize', resize);
  resize();

  function loop(){
    resize();
    var w = cv.width, h = cv.height;
    ctx.clearRect(0,0,w,h);
    var t = (performance.now() - t0) / 1000;
    var cx = w/2, cy = h*0.08;
    var len = P.length * Math.min(w,h) / 300;
    var omega = Math.sqrt(P.gravity / (P.length/100));
    var theta = Math.cos(omega * t) * 0.9;
    var bx = cx + Math.sin(theta)*len;
    var by = cy + Math.cos(theta)*len;
    // 支点
    ctx.fillStyle = '#7aa7d9';
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(3, w/100), 0, Math.PI*2); ctx.fill();
    // 绳
    ctx.strokeStyle = '#8b93a3'; ctx.lineWidth = Math.max(1, w/500);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();
    // 摆锤
    ctx.fillStyle = '#e2a35c';
    ctx.beginPath(); ctx.arc(bx, by, Math.max(8, w/40), 0, Math.PI*2); ctx.fill();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
